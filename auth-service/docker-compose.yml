services:
  postgres:
    container_name: auth_db
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: auth_db
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - dating-network
    restart: unless-stopped

  mail-dev:
    container_name: mail_dev_auth
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"

networks:
  dating-network:
    driver: bridge

volumes:
  postgres:
    driver: local